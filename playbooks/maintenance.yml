---
- name: Ubuntu server maintenance
  hosts: all
  become: true
  gather_facts: true

  tasks:

    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Upgrade installed packages
      ansible.builtin.apt:
        upgrade: dist
        autoremove: true
        autoclean: true

    - name: Check disk usage
      ansible.builtin.command: df -hT
      register: disk_usage
      changed_when: false

    - name: Display disk usage
      ansible.builtin.debug:
        var: disk_usage.stdout_lines

    - name: Check memory
      ansible.builtin.command: free -h
      register: memory_usage
      changed_when: false

    - name: Display memory usage
      ansible.builtin.debug:
        var: memory_usage.stdout_lines

    - name: Check system uptime
      ansible.builtin.command: uptime
      register: system_uptime
      changed_when: false

    - name: Display uptime
      ansible.builtin.debug:
        var: system_uptime.stdout

    - name: Check failed systemd services
      ansible.builtin.command: systemctl --failed --no-legend
      register: failed_services
      changed_when: false

    - name: Display failed services
      ansible.builtin.debug:
        msg: "{{ failed_services.stdout_lines | default([]) }}"

    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Report reboot requirement
      ansible.builtin.debug:
        msg: "REBOOT REQUIRED"
      when: reboot_required.stat.exists

    - name: Report system is OK
      ansible.builtin.debug:
        msg: "No reboot required"
      when: not reboot_required.stat.exists
