---
- name: Ubuntu server maintenance
  hosts: ubuntu_servers
  become: true
  gather_facts: true

  tasks:

    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Upgrade all packages
      ansible.builtin.apt:
        upgrade: dist
        autoremove: true
        autoclean: true

    - name: Check filesystem usage
      ansible.builtin.shell: |
        df -hT
      register: disk_usage
      changed_when: false

    - name: Show filesystem usage
      ansible.builtin.debug:
        var: disk_usage.stdout_lines

    - name: Check memory usage
      ansible.builtin.shell: |
        free -h
      register: memory_usage
      changed_when: false

    - name: Show memory usage
      ansible.builtin.debug:
        var: memory_usage.stdout_lines

    - name: Check system uptime
      ansible.builtin.command: uptime
      register: uptime
      changed_when: false

    - name: Show uptime
      ansible.builtin.debug:
        var: uptime.stdout

    - name: Check failed systemd services
      ansible.builtin.command: systemctl --failed --no-legend
      register: failed_services
      changed_when: false

    - name: Show failed services
      ansible.builtin.debug:
        msg: "{{ failed_services.stdout_lines | default([]) }}"

    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Report reboot requirement
      ansible.builtin.debug:
        msg: "⚠️ Reboot is required"
      when: reboot_required.stat.exists

    - name: Check important services
      ansible.builtin.service_facts:

    - name: Show failed services from service facts
      ansible.builtin.debug:
        msg: >-
          {{ ansible_facts.services
             | dict2items
             | selectattr('value.state', 'equalto', 'failed')
             | map(attribute='key')
             | list }}
